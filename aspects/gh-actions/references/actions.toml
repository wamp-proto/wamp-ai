# The gh-actions pin table: the one place that says which commit of each third-party
# GitHub Action the member repositories run. See ../SKILL.md.
#
# One entry per action REPOSITORY (owner/repo). An action in a subdirectory of its
# repository (github/codeql-action/init, .../analyze) uses its repository's entry.
#
#   sha      the full 40-hex commit the version tag points to (for an annotated tag,
#            the commit it peels to: `git ls-remote --tags <url>` shows it as `^{}`)
#   version  that tag, exactly vMAJOR.MINOR.PATCH; written after the pin as a comment
#
# A member's `uses:` line must read `<action>@<sha> # <version>` for its entry.
# Moving an entry to a new MAJOR is the decision for every member: the commit that
# does it names the breaking changes and how they were verified. scripts/latest.py
# lists the entries that are behind.

# Pinned 2026-11-11 (wamp-proto/wamp-ai#44). The three actions behind the Node 20
# deprecation warning are at their newest release; checkout and upload-artifact as in
# wamp-proto/wamp-cicd#96. Every other action is at the newest release of the major the
# members ran before, so this table pins them without a major bump.

